name: Release
on:
  push:
    branches:
      - main
  # Publishes the version on main again, if a publish failed.
  workflow_dispatch:
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # A tag made with GITHUB_TOKEN starts no other workflow, so the package is
  # published here and not from a tag push.
  publish:
    name: NPM
    needs: release-please
    if: needs.release-please.outputs.released == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Release
        uses: actions/checkout@v4

      - name: Using Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run dist

      - name: Publish
        run: npm publish --access public
